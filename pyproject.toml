[tool.poetry]
name = "core-protocol"
version = "2.0.0"
description = "Lido core protocol"
authors = ["Lido"]
license = "GPL-3.0"
readme = "README.md"
packages = [{ include = "core_protocol", from = "contracts" }]

[tool.poetry.dependencies]
python = "^3.12.1"
setuptools = "^78.1.1"

[tool.poetry.group.dev.dependencies]
# Slither is pinned to an upstream commit because no released slither-analyzer (<=0.11.5)
# yet allows crytic-compile >=0.4.0, and only crytic-compile 0.4.x can parse Hardhat 3
# build-info. Switch back to a released slither-analyzer once one ships that support.
# slitherin is intentionally not included: its latest release (0.7.2, 2024) is incompatible
# with this Slither's API and the project is unmaintained.
slither-analyzer = { git = "https://github.com/crytic/slither.git", rev = "5e78b88c0235885aa0a3f0ac3124d5eace3f1c40" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
